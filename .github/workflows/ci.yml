# ---------------------------------------------------------------------------
# Two lanes, and the split is the design decision worth explaining.
#
# The FAST LANE runs on every push and every pull request and needs no containers at
# all: lint, unit tests against committed API fixtures, DAG import checks, dbt parse,
# compose model validation, alert-rule unit tests, and a project convention gate. It
# gives a verdict in a couple of minutes, so it is a tool people actually wait for.
#
# The INTEGRATION LANE brings the real stack up and runs the whole pipeline end to end.
# It is genuinely slow (image pulls alone are several GB), so it runs on pushes to main
# and on demand rather than on every commit. Coverage is not reduced by that choice, only
# feedback latency, which is the right thing to trade.
#
# The DELIVERY LANE deploys the tested commit to a demo environment, gated on the
# integration lane so nothing ships that has not already been stood up from scratch and
# verified end to end. It deploys a SHA rather than a branch, health-checks with the same
# per-stage verification CI uses, and rolls back automatically if that fails.
#
# It is worth saying why this lane did not exist until there was somewhere to deliver to.
# A deploy step with no environment behind it is theatre, and the honest thing to ship was
# CI plus a written promotion model. Now that a real host exists, the theatre becomes a
# gate. If the environment secrets are absent, as on a fork, the job skips with a notice
# rather than failing, because a fork's CI should still be green.
#
# WHERE THESE JOBS RUN. Every job targets `${{ vars.CI_RUNNER || 'ubuntu-latest' }}`, so
# the default is GitHub-hosted and anyone who forks this repository gets working CI with
# no setup. Setting a repository variable CI_RUNNER to a runner label redirects every job
# to a self-hosted runner with that label, which is how this repository currently runs
# while GitHub-hosted compute is unavailable on the account. One variable, no file edit,
# and reverting is deleting the variable.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref. Without this, a branch with
# several quick commits queues several full integration runs that all test stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Every job that touches the pipeline code runs offline against committed fixtures.
  # CI must never depend on a third party's uptime to go green.
  SOURCE_API_MODE: fixture

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Hosted runners only. The Actions cache service is unreachable while the
          # account is billing-locked, and setup-python does not fail fast on that: it
          # spends ten minutes on a restore that ends in "Server failed to authenticate
          # the request", which is long enough to blow this job's timeout. A self-hosted
          # runner does not need it anyway, because pip's own ~/.cache/pip survives
          # between runs on a persistent machine.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
      - run: pip install ruff==0.12.5
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format
        run: ruff format --check .

  # -------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Hosted runners only. The Actions cache service is unreachable while the
          # account is billing-locked, and setup-python does not fail fast on that: it
          # spends ten minutes on a restore that ends in "Server failed to authenticate
          # the request", which is long enough to blow this job's timeout. A self-hosted
          # runner does not need it anyway, because pip's own ~/.cache/pip survives
          # between runs on a persistent machine.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
      - run: pip install -r requirements/dev.txt
      - name: pytest
        # No containers, no network. The API fixtures are committed, so these tests are
        # deterministic rather than dependent on the World Bank API being up, which
        # matters: that API intermittently returns HTTP 400 for valid requests.
        env:
          POSTGRES_PASSWORD: ci-not-a-real-secret
          CLICKHOUSE_PASSWORD: ci-not-a-real-secret
        # Coverage is scoped to the four modules this lane can actually reach, with a
        # floor of 85 (currently 90). ingest/load_postgres.py, ingest/run.py and
        # ingest/exporter.py need a live PostgreSQL and ClickHouse, so measuring them
        # from a no-container lane would either produce a meaninglessly low global
        # number or pressure someone into writing mock-heavy tests that assert the
        # mocks. Those three are covered by the integration lane, which runs the whole
        # pipeline end to end and asserts on real row counts.
        run: |
          pytest tests/unit -q \
            --cov=ingest.api_client --cov=ingest.checks \
            --cov=ingest.contracts --cov=ingest.settings \
            --cov-report=term-missing --cov-fail-under=85

  # -------------------------------------------------------------------------
  static:
    name: Static checks and conventions
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compose model is valid
        # Catches a profile or override mistake before anything is started, and proves
        # every ${VAR} the compose file references can actually resolve.
        run: |
          python scripts/gen_env.py
          docker compose --profile observability --profile orchestration --profile console config > /dev/null
          echo "compose config OK"

      - name: Connector config renders to a valid Connect payload
        # The committed connector JSON carries "//" documentation keys that Connect's
        # flat string map cannot accept, and ${VAR} placeholders. This proves the
        # renderer strips and substitutes correctly, and that no placeholder is left
        # unresolved, which would otherwise fail at registration with an
        # authentication error that never mentions the real cause.
        run: |
          set -a; . ./.env; set +a
          python scripts/render_connector.py cdc/connectors/postgres-source.json | python -c "
          import json,sys
          cfg=json.load(sys.stdin)
          assert all(isinstance(v,str) for v in cfg.values()), 'Connect config values must all be strings'
          assert not any(k.startswith('//') for k in cfg), 'documentation keys were not stripped'
          assert '\${' not in json.dumps(cfg), 'an unresolved placeholder survived'
          assert cfg['topic.prefix'], 'topic.prefix missing (the 3.x name for database.server.name)'
          assert cfg['plugin.name']=='pgoutput'
          print(f'connector config OK: {len(cfg)} properties')
          "

      - name: Alert rules are valid and behave as intended
        # promtool test rules is the part that matters. A rule whose expression evaluates
        # to an empty vector because of a label mismatch never fires and looks exactly
        # like a rule that is passing, so alert rules get unit tests like any other code.
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 check rules /p/alerts.yml
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 test rules /p/alerts_test.yml

      - name: Grafana dashboard is valid JSON with the expected panels
        run: |
          python -c "
          import json
          d=json.load(open('observability/grafana/dashboards/pipeline-health.json'))
          panels=[p for p in d['panels'] if p['type']!='row']
          assert d['uid'], 'dashboard needs a stable uid for provisioning'
          assert len(panels) >= 6, f'expected at least 6 panels, found {len(panels)}'
          assert all(p.get('description') for p in panels), 'every panel must explain itself'
          print(f'dashboard OK: {len(panels)} panels')
          "

      - name: Project convention gate
        # The rules no off-the-shelf linter knows: FINAL only via the shared macro, every
        # Replacing engine declaring its own order_by, every incremental model declaring
        # unique_key, pinned images, loopback-only ports, Debezium 3.x property names,
        # every alert having a for-duration and a runbook. Each one exists because
        # breaking it fails SILENTLY.
        run: bash scripts/ci/convention_gate.sh

  # -------------------------------------------------------------------------
  dags:
    name: Airflow DAG integrity
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Hosted runners only. The Actions cache service is unreachable while the
          # account is billing-locked, and setup-python does not fail fast on that: it
          # spends ten minutes on a restore that ends in "Server failed to authenticate
          # the request", which is long enough to blow this job's timeout. A self-hosted
          # runner does not need it anyway, because pip's own ~/.cache/pip survives
          # between runs on a persistent machine.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
      - name: Install Airflow with the official constraints
        # The constraints file is not optional: Airflow has a large dependency set and an
        # unconstrained install resolves to a combination nobody tests.
        run: |
          pip install "apache-airflow==2.10.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-${{ env.PYTHON_VERSION }}.txt"
          pip install clickhouse-connect==1.6.0 "psycopg[binary]==3.2.9" \
            pydantic==2.11.7 pydantic-settings==2.10.1 pyyaml==6.0.2 \
            httpx==0.28.1 tenacity==9.1.2
      - name: DAGs import cleanly
        # This is the cheapest high-value check in the whole workflow. A DAG with an
        # import error does not appear in the UI at all, so the failure mode is a
        # pipeline that silently is not there.
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:///${{ runner.temp }}/airflow-ci.db
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          POSTGRES_PASSWORD: ci-not-a-real-secret
          CLICKHOUSE_PASSWORD: ci-not-a-real-secret
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Not muted: on a persistent runner a stale metadata DB makes this fail, and
          # hiding the output turns that into an inexplicable DagBag error later.
          airflow db migrate
          python - <<'PY'
          import sys
          from airflow.models import DagBag
          bag = DagBag("dags", include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"::error file={path}::{err}")
              sys.exit(1)
          expected = {"wb_cdc_pipeline", "cdc_health_monitor"}
          found = set(bag.dag_ids)
          assert expected <= found, f"missing DAGs: {expected - found}"
          for dag_id in sorted(found):
              dag = bag.get_dag(dag_id)
              # Every DAG must have a watcher. `end` uses all_done so the graph has one
              # clean leaf, but all_done also succeeds when upstream tasks failed, so a
              # DAG without a one_failed leaf reports green for a run that broke.
              watchers = [t for t in dag.tasks if t.trigger_rule == "one_failed"]
              assert watchers, f"{dag_id} has no one_failed watcher task"
              # And every DAG must be documented in the UI.
              assert dag.doc_md, f"{dag_id} has no doc_md"
              print(f"  {dag_id}: {len(dag.tasks)} tasks, watcher present, documented")
          print(f"OK: {len(found)} DAGs, no import errors")
          PY

  # -------------------------------------------------------------------------
  dbt:
    name: dbt parse and compile
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Hosted runners only. The Actions cache service is unreachable while the
          # account is billing-locked, and setup-python does not fail fast on that: it
          # spends ten minutes on a restore that ends in "Server failed to authenticate
          # the request", which is long enough to blow this job's timeout. A self-hosted
          # runner does not need it anyway, because pip's own ~/.cache/pip survives
          # between runs on a persistent machine.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
      - name: Install dbt with the resolved pin set
        # Pinned to the set pip's resolver converges on. Unpinned, it first tries
        # dbt-core 1.12.0, discovers dbt-clickhouse needs dbt-adapters<1.23.0, and
        # backtracks.
        run: pip install "dbt-core==1.11.12" "dbt-clickhouse==1.10.1" "dbt-adapters==1.22.10"
      - name: dbt deps and parse
        # `dbt parse` compiles every model, macro, test and YAML file without connecting
        # to a warehouse, so it catches a Jinja error, a bad ref, or a malformed schema
        # file in seconds. That covers the class of mistake that would otherwise surface
        # only in the slow integration lane.
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci-not-a-real-secret
          DBT_TARGET_PATH: ${{ runner.temp }}/dbt-target
          DBT_LOG_PATH: ${{ runner.temp }}/dbt-logs
          # dbt_project.yml defaults packages-install-path to /opt/dbt-packages, which is
          # what the containers need: they mount the project read-only, so `dbt deps` has to
          # write outside the mount. That default assumes a writable /opt, which is true on
          # a hosted runner and false on an ordinary Linux box where /opt is root-owned.
          # Pointing it at the per-job temp directory makes this job runner-agnostic and
          # has the side benefit of not carrying packages between runs.
          DBT_PACKAGES_PATH: ${{ runner.temp }}/dbt-packages
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt
          echo "dbt project parses cleanly"

  # -------------------------------------------------------------------------
  integration:
    name: Full stack end to end
    # Only on main and on demand. The pulls alone are several GB, so running this on
    # every pull request would make CI something people work around rather than with.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: [lint, unit, static]
    # Serialised independently of ref. The Compose project name and host ports are fixed, so
    # two integration runs sharing one runner host would attach to the same containers and
    # volumes and assert on each other's data. cancel-in-progress is false because a
    # half-torn-down stack is worse than a queued run.
    concurrency:
      group: integration-stack
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # HOSTED RUNNERS ONLY, and the guard is not cosmetic. A GitHub runner ships with
        # about 14 GB free, most of it preinstalled toolchains this job never uses, and the
        # stack's images total roughly 6.4 GB deduped; without the reclaim the job dies
        # partway through an image pull with an error that reads like a network problem.
        #
        # On a self-hosted runner the same lines are actively harmful: the paths may hold
        # toolchains someone depends on, `sudo` is not guaranteed to be passwordless, and
        # `|| true` would hide the failure either way. A purpose-built runner is provisioned
        # with disk instead, which the assertion in the next step verifies rather than
        # assumes.
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Assert there is enough disk for the stack
        # Runs on every runner type, because the requirement is real regardless of who
        # provides the machine. Without it the disk need is assumed, and the failure it
        # prevents surfaces 10 minutes later disguised as something else.
        run: |
          avail_gb=$(df --output=avail --block-size=1G / | tail -1 | tr -dc '0-9')
          echo "available: ${avail_gb} GB on ${{ runner.environment }} runner"
          if [ "${avail_gb:-0}" -lt 25 ]; then
            echo "::error::only ${avail_gb} GB free; this lane needs ~11 GB plus headroom for the image pull and build cache."
            exit 1
          fi

      - name: Run the whole pipeline, offline
        # This is `make demo`: preflight, generate secrets, start the stack, apply DDL,
        # register the CDC connector, ingest from committed fixtures, wait for CDC parity,
        # build and test the dbt models, then verify every stage. Exactly what a reviewer
        # runs, which is the point.
        env:
          SOURCE_API_MODE: fixture
        run: make demo

      - name: Verify every stage, strictly
        run: bash scripts/verify_stages.sh --strict

      - name: Prove UPDATE and DELETE propagate
        # Inserts are the easy case. An update that does not propagate leaves a stale
        # value, and a delete that does not leaves a row the source no longer has;
        # neither errors and both pass every uniqueness test.
        run: bash scripts/demo_mutations.sh

      - name: Prove idempotency
        # A second ingestion must write nothing. If the change-detecting upsert regressed,
        # every row would be rewritten and every no-op update would emit a CDC event.
        env:
          SOURCE_API_MODE: fixture
        run: |
          docker compose run --rm pipeline python -m ingest.run 2>&1 | tee ${{ runner.temp }}/second-run.log
          grep -q "unchanged=2970" ${{ runner.temp }}/second-run.log \
            || { echo "::error::a second ingestion did not report unchanged=2970; change detection has regressed"; exit 1; }
          echo "idempotency confirmed: the second run wrote nothing"

      - name: Prove the dbt incremental model does not duplicate
        run: |
          set -a; . ./.env; set +a
          before=$(docker compose exec -T clickhouse clickhouse-client --user "$CLICKHOUSE_USER" \
            --password "$CLICKHOUSE_PASSWORD" -q "SELECT count() FROM marts.fct_indicator_observation")
          docker compose run --rm pipeline dbt build --project-dir /app/dbt --profiles-dir /app/dbt
          after=$(docker compose exec -T clickhouse clickhouse-client --user "$CLICKHOUSE_USER" \
            --password "$CLICKHOUSE_PASSWORD" -q "SELECT count() FROM marts.fct_indicator_observation")
          echo "fact rows before=$before after=$after"
          [ "$before" = "$after" ] || { echo "::error::the incremental model duplicated rows; unique_key may be missing"; exit 1; }

      - name: Observability comes up populated
        run: |
          set -a; . ./.env; set +a
          docker compose --profile observability up -d --wait

          # Wait for the first scrape cycle before asserting anything.
          #
          # `up --wait` returns when containers report healthy, which is strictly earlier
          # than Prometheus having scraped anything: the interval is 15s, so an immediate
          # check sees every target as down and the job fails on a race rather than on a
          # defect. This was a latent bug: the assertion below has never actually run in
          # GitHub Actions, so nothing caught it until this lane ran on a real machine.
          #
          # Bounded, and it does not assert. The assertions stay below so that a genuine
          # failure still reports which specific job is down rather than "timed out".
          for _ in $(seq 1 24); do
            body=$(curl -sf "http://127.0.0.1:${PROMETHEUS_HOST_PORT}/api/v1/targets" || true)
            ups=$(printf '%s' "$body" | grep -o '"health":"up"' | wc -l)
            bad=$(printf '%s' "$body" | grep -oE '"health":"(down|unknown)"' | wc -l)
            if [ "${ups:-0}" -gt 0 ] && [ "${bad:-0}" -eq 0 ]; then break; fi
            sleep 5
          done

          # Every scrape target must be up, or a dashboard panel is silently empty.
          curl -sf "http://127.0.0.1:${PROMETHEUS_HOST_PORT}/api/v1/targets" | python3 -c "
          import sys,json
          t=json.load(sys.stdin)['data']['activeTargets']
          down=[x['labels']['job'] for x in t if x['health']!='up']
          assert not down, f'scrape targets down: {down}'
          print(f'{len(t)} scrape targets, all up')
          "
          curl -sf "http://127.0.0.1:${PROMETHEUS_HOST_PORT}/api/v1/rules" | python3 -c "
          import sys,json
          g=json.load(sys.stdin)['data']['groups']
          rules=[r for grp in g for r in grp['rules']]
          firing=[r['name'] for r in rules if r.get('state')=='firing']
          assert len(rules) >= 8, f'expected at least 8 alert rules, loaded {len(rules)}'
          assert not firing, f'alerts firing on a healthy stack: {firing}'
          print(f'{len(rules)} alert rules loaded, none firing')
          "

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          for s in postgres redpanda connect clickhouse pipeline-exporter prometheus; do
            echo "::group::$s"; docker compose logs --tail=80 "$s" || true; echo "::endgroup::"
          done
          df -h / | tail -1

      - name: Tear down
        if: always()
        # `clean` removes the volumes, which takes the replication slot with them. Leaving
        # a slot behind on a throwaway runner is harmless, but the habit is not.
        run: make clean || true

  # -------------------------------------------------------------------------
  ci-summary:
    name: CI summary
    # A single required check for branch protection, so adding a job later does not mean
    # editing the protection rule and forgetting.
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [lint, unit, static, dags, dbt]
    steps:
      - name: Verdict
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} static=${{ needs.static.result }} dags=${{ needs.dags.result }} dbt=${{ needs.dbt.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more fast-lane jobs failed"
            exit 1
          fi
          echo "fast lane green"

  # -------------------------------------------------------------------------
  # CONTINUOUS DELIVERY.
  #
  # This job exists only because there is now a real environment to deliver to. Until
  # there was one, this file deliberately had no deploy step, on the grounds that a
  # workflow which pretends to deploy is worse than one that admits it does not.
  #
  # The gate is the whole point: `needs` includes the integration lane, so nothing reaches
  # the environment unless the full stack has already been stood up from scratch, had its
  # six stages verified, and had UPDATE and DELETE propagation proven. A deploy job that
  # only waits for linting is a deploy job that ships broken data pipelines quickly.
  #
  # What makes this safe rather than merely automated:
  #   - it deploys github.sha, never a branch, so the artifact is the one CI tested;
  #   - the host records the previous SHA and rolls back automatically if the post-deploy
  #     verification fails, so the rollback path is exercised on every deploy;
  #   - the health check is scripts/verify_stages.sh --strict, which asserts source to
  #     warehouse parity rather than merely checking that a port answers;
  #   - concurrency is serialised on the environment, because two concurrent deploys to
  #     one host would fight over the same containers, volumes and fixed host ports;
  #   - the SSH key is dedicated to this host and authorises nothing else, so a compromised
  #     workflow cannot reach anything but the demo box;
  #   - the host key is pinned from a secret, so the connection is not trust-on-first-use.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to demo environment
    # Never from a pull request: a fork must not be able to reach the environment, and a
    # PR has not run the integration lane anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, static, dags, dbt, integration]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Surfaces the deployment and its URL in the repository UI, and gives a single place to
    # add a required reviewer later without touching this file.
    environment:
      name: demo
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - name: Skip cleanly when the environment is not configured
        # A fork, or this repository before the secrets exist, should not see a red X for
        # something that is not its fault.
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEPLOY_HOST secret; skipping deployment. This is expected on a fork."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the dedicated deploy key
        if: steps.gate.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/wbcdc_deploy
          chmod 600 ~/.ssh/wbcdc_deploy
          # Pinned host key rather than StrictHostKeyChecking=no, so this cannot be
          # silently redirected to another host.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts_wbcdc
          chmod 600 ~/.ssh/known_hosts_wbcdc

      - name: Deploy this exact commit, with rollback on failure
        if: steps.gate.outputs.configured == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          # IdentitiesOnly is what makes "-i" a guarantee rather than a preference: without
          # it ssh will happily offer any key already in an agent or in ~/.ssh, so on a
          # persistent runner the connection could succeed with a broader key than the
          # dedicated one. BatchMode stops it falling back to an interactive prompt and
          # hanging until the job timeout.
          ssh -i ~/.ssh/wbcdc_deploy \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              -o BatchMode=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts_wbcdc \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "bash ~/wb-cdc-analytics/scripts/deploy_remote.sh '$SHA'"

      - name: Smoke test the public surface from outside the host
        if: steps.gate.outputs.configured == 'true'
        # Deliberately run from the runner, not over SSH. Checking from the host itself
        # would pass even if the proxy, the certificate or the firewall were broken, which
        # are exactly the parts a user experiences.
        run: |
          fail=0
          for url in "${{ vars.DEPLOY_URL }}" \
                     "$(echo '${{ vars.DEPLOY_URL }}' | sed 's|https://|https://grafana.|')" \
                     "$(echo '${{ vars.DEPLOY_URL }}' | sed 's|https://|https://console.|')"; do
            # No -k: an expired or invalid certificate must fail this step.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url" || echo 000)
            case "$code" in
              200|301|302|401) echo "  ok   $url -> $code" ;;
              *) echo "  FAIL $url -> $code"; fail=1 ;;
            esac
          done
          [ "$fail" = "0" ] || { echo "::error::the deployed environment is not serving correctly"; exit 1; }

      - name: Report what is deployed
        # always(), because a failed deploy is exactly when someone reads this. But the text
        # must then depend on the outcome: an unconditional "Deployed / Verified" block under
        # always() asserts the opposite of reality after a rollback, and the job summary is
        # one of the few things a reviewer actually reads.
        if: always() && steps.gate.outputs.configured == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            {
              echo "### Deployed"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Commit | \`${{ github.sha }}\` |"
              echo "| Environment | ${{ vars.DEPLOY_URL }} |"
              echo "| Verified | \`verify_stages.sh --strict\` on the host, then HTTPS from the runner |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deploy FAILED"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Attempted commit | \`${{ github.sha }}\` |"
              echo "| Environment | ${{ vars.DEPLOY_URL }} |"
              echo "| State | The host rolls back automatically when its own verification fails."
              echo "Check the deploy step log for which SHA it returned to, and do not assume this commit is live. |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the key from the runner
        # The runner is persistent and self-hosted, so the key must not be left behind on
        # disk between jobs. `always()` so this also runs when the deploy failed.
        if: always()
        run: rm -f ~/.ssh/wbcdc_deploy ~/.ssh/known_hosts_wbcdc
