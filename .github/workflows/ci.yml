# ---------------------------------------------------------------------------
# Two lanes, and the split is the design decision worth explaining.
#
# The FAST LANE runs on every push and every pull request and needs no containers at
# all: lint, unit tests against committed API fixtures, DAG import checks, dbt parse,
# compose model validation, alert-rule unit tests, and a project convention gate. It
# gives a verdict in a couple of minutes, so it is a tool people actually wait for.
#
# The INTEGRATION LANE brings the real stack up and runs the whole pipeline end to end.
# It is genuinely slow (image pulls alone are several GB), so it runs on pushes to main
# and on demand rather than on every commit. Coverage is not reduced by that choice, only
# feedback latency, which is the right thing to trade.
#
# Deliberately NOT here: any deploy step. There is no environment to deploy to, and a
# workflow that pretends otherwise is theatre. What CI validates instead is that a
# reviewer's `make demo` will work, which is the actual promise this repository makes.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref. Without this, a branch with
# several quick commits queues several full integration runs that all test stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Every job that touches the pipeline code runs offline against committed fixtures.
  # CI must never depend on a third party's uptime to go green.
  SOURCE_API_MODE: fixture

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.12.5
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format
        run: ruff format --check .

  # -------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt
      - name: pytest
        # No containers, no network. The API fixtures are committed, so these tests are
        # deterministic rather than dependent on the World Bank API being up, which
        # matters: that API intermittently returns HTTP 400 for valid requests.
        env:
          POSTGRES_PASSWORD: ci-not-a-real-secret
          CLICKHOUSE_PASSWORD: ci-not-a-real-secret
        # Coverage is scoped to the four modules this lane can actually reach, with a
        # floor of 85 (currently 90). ingest/load_postgres.py, ingest/run.py and
        # ingest/exporter.py need a live PostgreSQL and ClickHouse, so measuring them
        # from a no-container lane would either produce a meaninglessly low global
        # number or pressure someone into writing mock-heavy tests that assert the
        # mocks. Those three are covered by the integration lane, which runs the whole
        # pipeline end to end and asserts on real row counts.
        run: |
          pytest tests/unit -q \
            --cov=ingest.api_client --cov=ingest.checks \
            --cov=ingest.contracts --cov=ingest.settings \
            --cov-report=term-missing --cov-fail-under=85

  # -------------------------------------------------------------------------
  static:
    name: Static checks and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compose model is valid
        # Catches a profile or override mistake before anything is started, and proves
        # every ${VAR} the compose file references can actually resolve.
        run: |
          python scripts/gen_env.py
          docker compose --profile observability --profile orchestration --profile console config > /dev/null
          echo "compose config OK"

      - name: Connector config renders to a valid Connect payload
        # The committed connector JSON carries "//" documentation keys that Connect's
        # flat string map cannot accept, and ${VAR} placeholders. This proves the
        # renderer strips and substitutes correctly, and that no placeholder is left
        # unresolved, which would otherwise fail at registration with an
        # authentication error that never mentions the real cause.
        run: |
          set -a; . ./.env; set +a
          python scripts/render_connector.py cdc/connectors/postgres-source.json | python -c "
          import json,sys
          cfg=json.load(sys.stdin)
          assert all(isinstance(v,str) for v in cfg.values()), 'Connect config values must all be strings'
          assert not any(k.startswith('//') for k in cfg), 'documentation keys were not stripped'
          assert '\${' not in json.dumps(cfg), 'an unresolved placeholder survived'
          assert cfg['topic.prefix'], 'topic.prefix missing (the 3.x name for database.server.name)'
          assert cfg['plugin.name']=='pgoutput'
          print(f'connector config OK: {len(cfg)} properties')
          "

      - name: Alert rules are valid and behave as intended
        # promtool test rules is the part that matters. A rule whose expression evaluates
        # to an empty vector because of a label mismatch never fires and looks exactly
        # like a rule that is passing, so alert rules get unit tests like any other code.
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 check rules /p/alerts.yml
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 test rules /p/alerts_test.yml

      - name: Grafana dashboard is valid JSON with the expected panels
        run: |
          python -c "
          import json
          d=json.load(open('observability/grafana/dashboards/pipeline-health.json'))
          panels=[p for p in d['panels'] if p['type']!='row']
          assert d['uid'], 'dashboard needs a stable uid for provisioning'
          assert len(panels) >= 6, f'expected at least 6 panels, found {len(panels)}'
          assert all(p.get('description') for p in panels), 'every panel must explain itself'
          print(f'dashboard OK: {len(panels)} panels')
          "

      - name: Project convention gate
        # The rules no off-the-shelf linter knows: FINAL only via the shared macro, every
        # Replacing engine declaring its own order_by, every incremental model declaring
        # unique_key, pinned images, loopback-only ports, Debezium 3.x property names,
        # every alert having a for-duration and a runbook. Each one exists because
        # breaking it fails SILENTLY.
        run: bash scripts/ci/convention_gate.sh

  # -------------------------------------------------------------------------
  dags:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow with the official constraints
        # The constraints file is not optional: Airflow has a large dependency set and an
        # unconstrained install resolves to a combination nobody tests.
        run: |
          pip install "apache-airflow==2.10.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-${{ env.PYTHON_VERSION }}.txt"
          pip install clickhouse-connect==1.6.0 "psycopg[binary]==3.2.9" \
            pydantic==2.11.7 pydantic-settings==2.10.1 pyyaml==6.0.2 \
            httpx==0.28.1 tenacity==9.1.2
      - name: DAGs import cleanly
        # This is the cheapest high-value check in the whole workflow. A DAG with an
        # import error does not appear in the UI at all, so the failure mode is a
        # pipeline that silently is not there.
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow-ci.db
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          POSTGRES_PASSWORD: ci-not-a-real-secret
          CLICKHOUSE_PASSWORD: ci-not-a-real-secret
          PYTHONPATH: ${{ github.workspace }}
        run: |
          airflow db migrate > /dev/null 2>&1
          python - <<'PY'
          import sys
          from airflow.models import DagBag
          bag = DagBag("dags", include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"::error file={path}::{err}")
              sys.exit(1)
          expected = {"wb_cdc_pipeline", "cdc_health_monitor"}
          found = set(bag.dag_ids)
          assert expected <= found, f"missing DAGs: {expected - found}"
          for dag_id in sorted(found):
              dag = bag.get_dag(dag_id)
              # Every DAG must have a watcher. `end` uses all_done so the graph has one
              # clean leaf, but all_done also succeeds when upstream tasks failed, so a
              # DAG without a one_failed leaf reports green for a run that broke.
              watchers = [t for t in dag.tasks if t.trigger_rule == "one_failed"]
              assert watchers, f"{dag_id} has no one_failed watcher task"
              # And every DAG must be documented in the UI.
              assert dag.doc_md, f"{dag_id} has no doc_md"
              print(f"  {dag_id}: {len(dag.tasks)} tasks, watcher present, documented")
          print(f"OK: {len(found)} DAGs, no import errors")
          PY

  # -------------------------------------------------------------------------
  dbt:
    name: dbt parse and compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dbt with the resolved pin set
        # Pinned to the set pip's resolver converges on. Unpinned, it first tries
        # dbt-core 1.12.0, discovers dbt-clickhouse needs dbt-adapters<1.23.0, and
        # backtracks.
        run: pip install "dbt-core==1.11.12" "dbt-clickhouse==1.10.1" "dbt-adapters==1.22.10"
      - name: dbt deps and parse
        # `dbt parse` compiles every model, macro, test and YAML file without connecting
        # to a warehouse, so it catches a Jinja error, a bad ref, or a malformed schema
        # file in seconds. That covers the class of mistake that would otherwise surface
        # only in the slow integration lane.
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci-not-a-real-secret
          DBT_TARGET_PATH: /tmp/dbt-target
          DBT_LOG_PATH: /tmp/dbt-logs
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt
          echo "dbt project parses cleanly"

  # -------------------------------------------------------------------------
  integration:
    name: Full stack end to end
    # Only on main and on demand. The pulls alone are several GB, so running this on
    # every pull request would make CI something people work around rather than with.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, unit, static]
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The stack's images total roughly 8 GB and a GitHub runner ships with about 14 GB
        # free, most of it preinstalled toolchains this job never uses. Without this the
        # job fails partway through an image pull, which reads as a network problem.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1

      - name: Run the whole pipeline, offline
        # This is `make demo`: preflight, generate secrets, start the stack, apply DDL,
        # register the CDC connector, ingest from committed fixtures, wait for CDC parity,
        # build and test the dbt models, then verify every stage. Exactly what a reviewer
        # runs, which is the point.
        env:
          SOURCE_API_MODE: fixture
        run: make demo

      - name: Verify every stage, strictly
        run: bash scripts/verify_stages.sh --strict

      - name: Prove UPDATE and DELETE propagate
        # Inserts are the easy case. An update that does not propagate leaves a stale
        # value, and a delete that does not leaves a row the source no longer has;
        # neither errors and both pass every uniqueness test.
        run: bash scripts/demo_mutations.sh

      - name: Prove idempotency
        # A second ingestion must write nothing. If the change-detecting upsert regressed,
        # every row would be rewritten and every no-op update would emit a CDC event.
        env:
          SOURCE_API_MODE: fixture
        run: |
          docker compose run --rm pipeline python -m ingest.run 2>&1 | tee /tmp/second-run.log
          grep -q "unchanged=2970" /tmp/second-run.log \
            || { echo "::error::a second ingestion did not report unchanged=2970; change detection has regressed"; exit 1; }
          echo "idempotency confirmed: the second run wrote nothing"

      - name: Prove the dbt incremental model does not duplicate
        run: |
          set -a; . ./.env; set +a
          before=$(docker compose exec -T clickhouse clickhouse-client --user "$CLICKHOUSE_USER" \
            --password "$CLICKHOUSE_PASSWORD" -q "SELECT count() FROM marts.fct_indicator_observation")
          docker compose run --rm pipeline dbt build --project-dir /app/dbt --profiles-dir /app/dbt
          after=$(docker compose exec -T clickhouse clickhouse-client --user "$CLICKHOUSE_USER" \
            --password "$CLICKHOUSE_PASSWORD" -q "SELECT count() FROM marts.fct_indicator_observation")
          echo "fact rows before=$before after=$after"
          [ "$before" = "$after" ] || { echo "::error::the incremental model duplicated rows; unique_key may be missing"; exit 1; }

      - name: Observability comes up populated
        run: |
          set -a; . ./.env; set +a
          docker compose --profile observability up -d --wait
          # Every scrape target must be up, or a dashboard panel is silently empty.
          curl -sf "http://127.0.0.1:${PROMETHEUS_HOST_PORT}/api/v1/targets" | python3 -c "
          import sys,json
          t=json.load(sys.stdin)['data']['activeTargets']
          down=[x['labels']['job'] for x in t if x['health']!='up']
          assert not down, f'scrape targets down: {down}'
          print(f'{len(t)} scrape targets, all up')
          "
          curl -sf "http://127.0.0.1:${PROMETHEUS_HOST_PORT}/api/v1/rules" | python3 -c "
          import sys,json
          g=json.load(sys.stdin)['data']['groups']
          rules=[r for grp in g for r in grp['rules']]
          firing=[r['name'] for r in rules if r.get('state')=='firing']
          assert len(rules) >= 8, f'expected at least 8 alert rules, loaded {len(rules)}'
          assert not firing, f'alerts firing on a healthy stack: {firing}'
          print(f'{len(rules)} alert rules loaded, none firing')
          "

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          for s in postgres redpanda connect clickhouse pipeline-exporter prometheus; do
            echo "::group::$s"; docker compose logs --tail=80 "$s" || true; echo "::endgroup::"
          done
          df -h / | tail -1

      - name: Tear down
        if: always()
        # `clean` removes the volumes, which takes the replication slot with them. Leaving
        # a slot behind on a throwaway runner is harmless, but the habit is not.
        run: make clean || true

  # -------------------------------------------------------------------------
  ci-summary:
    name: CI summary
    # A single required check for branch protection, so adding a job later does not mean
    # editing the protection rule and forgetting.
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, unit, static, dags, dbt]
    steps:
      - name: Verdict
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} static=${{ needs.static.result }} dags=${{ needs.dags.result }} dbt=${{ needs.dbt.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more fast-lane jobs failed"
            exit 1
          fi
          echo "fast lane green"
