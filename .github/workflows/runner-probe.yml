name: runner-probe
on:
  push:
    branches: [runner-probe]
jobs:
  probe:
    # Probe 2: does the `vars` context work in runs-on, and does setup-python
    # find a writable tool cache without sudo on /opt?
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "runner=$RUNNER_NAME  tool_cache=$RUNNER_TOOL_CACHE  temp=$RUNNER_TEMP"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -V && which python
      - run: echo "LANG=$LANG"; printf 'a\xe2\x80\x94b\n' | grep -qP '[\x{2014}]' && echo "PCRE em-dash rule is ALIVE" || echo "PCRE rule DEAD"
